# ---------------------------------------------------------------------------
# cartographer configuration for the iTradeNetwork OMS workspace
#
# Pre-filled from the stack reference (2026-09-04). Copy to `cartographer.yaml`
# in your workspace root and adjust:
#
#     cp cartographer.itn.yaml /Users/rsengupta/projects/ong/cartographer.yaml
#     cd /Users/rsengupta/projects/ong && cartographer scan
#
# Then run `cartographer init --root . --dir /tmp/check` and diff the two: init
# reads the actual repos, so anything it finds that is missing here is drift
# since the reference was written. Trust init over this file.
#
# Confidence markers below mirror the reference: entries without a marker were
# confirmed from source; (?) means unresolved -- verify before relying on it.
# ---------------------------------------------------------------------------

roots:
  - /Users/rsengupta/projects/ong

defaults:
  history_months: 12
  call_edges: true
  # The backend is ~16k files. If a scan is slow, set call_edges: false first --
  # symbol-level call inference is where most of the time goes.
  max_commit_files: 40
  min_coupling_shared: 3
  min_coupling_degree: 0.30

services:

  # ===================== backend: reactor modules =========================
  # Shared libraries (gcutil, cache, kafkautil, framework, auth, elasticsearch,
  # misc) are deliberately NOT listed as services -- they are compiled into
  # other modules, not deployed. cartographer classifies them automatically.

  - name: common
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/common
    aliases: [cmn, cmndev]
    owns_data: [cmndev]
    purpose: "Foundational shared service; hosts the /api/auth/login entry point."

  - name: company
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/company
    aliases: [cmny, cmnydev]
    owns_data: [cmnydev]
    purpose: "Company/vendor/location and trading-partner data. Exposes a Spring AI MCP server."

  - name: user
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/user
    aliases: [usr, usrdev]
    owns_data: [usrdev]
    purpose: "User accounts and preferences. Has its OWN LdapController login path, separate from auth/common."

  - name: order
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/order
    aliases: [ord, orddev]
    owns_data: [orddev]
    purpose: "Purchase order transactions. Touches MySQL + Oracle + MSSQL via JNDI."

  - name: order-enterprise
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/order-enterprise
    aliases: [ome, omedev, omsenterprise, order-ent, enterprise]
    owns_data: [omedev]
    purpose: "Legacy enterprise order management. Deploys as a WAR on WildFly/JBoss, not Tomcat. Still linked from the Angular UI via ColdFusion pages."

  - name: catalog
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/catalog
    aliases: [ctlg, ctlgdev]
    owns_data: [ctlgdev]
    purpose: "Product/pricing catalog, USDA pricing, cost index. Redis-backed product alerts."

  - name: inventory
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/inventory
    aliases: [inv, invdev]
    owns_data: [invdev]
    purpose: "Real-time inventory grid. No confirmed Redis or Kafka usage."

  - name: comment
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/comment
    aliases: [cmt, cmtdev]
    owns_data: [cmtdev]
    purpose: "Comments on OME and order objects, plus live WebSocket chat. Redis is the ACTUAL store for chat messages, not a cache."

  - name: contract
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/contract
    aliases: [icr, icrdev, contracts, rebates]
    owns_data: [icrdev]
    purpose: "Contracts And Rebates Manager (VDA rebate processing). Separate Oracle datasource behind oracle.enable."

  - name: notification
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/notification
    aliases: [notif, notifdev]
    owns_data: [notifdev]
    purpose: "Email/push/SMS notifications. Firebase, Twilio, Freemarker templates."

  - name: report
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/report
    aliases: [rpt, rptdev, reports]
    owns_data: [rptdev]
    purpose: "Reporting microservice. Jasper/POI PDF and Excel generation, SFTP delivery."

  - name: nexus
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/nexus
    aliases: [nex]
    # (?) shares the cmndev schema literal with `common` in docker-compose.
    # Reference §2.6 flags this as unresolved: intentional, or a copy-paste?
    # cartographer will report it as a shared schema -- that finding is real.
    owns_data: [cmndev]
    purpose: "Nutrition/product reference data (USDA FoodData Central) and a rules engine. Only module using the elasticsearch lib."

  - name: integration
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/integration
    aliases: [int, intdev, dps]
    owns_data: [intdev]
    purpose: "DPS Integration -- external trading-partner/EDI via Oracle AQ. Two named Oracle UCP datasources (tpcom, dps)."

  - name: transform
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/transform
    aliases: [tfm, tfmdev, edi-transform]
    owns_data: [tfmdev]
    purpose: "EDI to JSON transformation for order intake."

  - name: agent
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/agent
    aliases: [emailagent, email-agent, emailagentdev, update-agent, rfq-agent]
    owns_data: [emailagentdev]
    purpose: "AI email/PDF ingestion agent -- buyer addendums, OCR, EDI-810 validation. Its own MySQL on 3307 and an EXTERNAL Confluent Cloud Kafka."
    # Reference §2.7: a hardcoded SASL credential lives in this module's
    # application.properties. `cartographer secrets` will flag its location and
    # will never record its value.

  - name: logstash-init
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/logstash-init
    aliases: []
    owns_data: []
    # (?) In the reactor with a live spring-boot-maven-plugin, but its Boot
    # description is Initializr boilerplate and it is absent from
    # docker-compose. Read its KnowledgeBase.md before treating it as live.
    purpose: "(?) unclear -- real service or abandoned scaffold."

  # =============== backend: OUTSIDE the Maven reactor =====================
  # The reference's most important correction: these ship but are excluded
  # from the parent pom's <modules>. A naive module scan misses both.
  # cartographer flags them as `module-outside-reactor` findings.

  - name: logistics
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/logistics
    aliases: [itl, itlsqe, itldev, freight]
    owns_data: []          # (?) schema not investigated in the reference pass
    purpose: "Logistics/freight. Own Dockerfile + Helm. Served from itlsqe.itradenetwork.net. NOT in the local docker-compose -- SQE/UAT/PRD only."

  - name: interoperability
    repo: /Users/rsengupta/projects/ong/ong-server-repo/server/interoperability
    aliases: [interop]
    owns_data: []          # has its own database/interoperability/patches dir
    purpose: "External system interoperability. Fully standalone pom (no parent). Deploys onto WildFly/JBoss per its module.xml."

  # ===================== services with no repo here =======================
  # Naming these means edges pointing at them resolve into real nodes instead
  # of being dropped. "Here is the boundary of what I can see" beats silence.

  - name: iml
    aliases: [imlsqe, imlagentsqe]
    # (?) Reference §3.1: IML is unresolved. Both IML hosts serve only
    # agent/RFQ-agent paths, which suggests AI-agent infrastructure -- but
    # that is inference, not fact. Good question for your team.
    purpose: "(?) unknown -- serves /rfq-agent/ and /update-agent/ proxy prefixes."

  - name: coldfusion-legacy
    aliases: [cfm, omsenterprise-cf]
    purpose: "Legacy ColdFusion app reached via enterpriseURL and the /omsenterprise/ prefix. Source is in NONE of the 5 repos -- location unknown."

  # ===================== frontends ========================================

  - name: ong-ui-repo
    repo: /Users/rsengupta/projects/ong/ong-ui-repo
    # NOTE: `ongsqe` is deliberately NOT an alias here. That host is the
    # shared backend gateway serving ~13 modules, not this UI. Leaving it
    # unresolved is correct: it appears as a `host` node instead.
    # `ong-ui` is also omitted: suffix-stripping would reduce it to the
    # bare prefix `ong`, which every repo and host shares, and that would
    # pull unrelated tokens into this service.
    aliases: [omsnextgen, oms-next-gen]
    owns_data: []
    purpose: "Primary OMS web UI. Angular 19 + NgRx, ~45 lazily-loaded route modules. Links out to live ColdFusion pages."

  - name: om-angular-repo
    repo: /Users/rsengupta/projects/ong/om-angular-repo
    aliases: [iom, iomsqe, order-and-stoc, orderandstock-web]
    owns_data: []
    # (?) Reference §4: whether this or bp-react-repo is the product branded
    # "OrderMaestro" is unresolved, and there is a THIRD Confluence-only
    # product of a similar name. Do not conflate them.
    purpose: "Order-guide/shopping/receiving/invoicing web app, codename IOM. Angular 16, no NgRx. Calls a strict SUBSET of backend modules via iomsqe."

  - name: bp-react-repo
    repo: /Users/rsengupta/projects/ong/bp-react-repo
    aliases: [orderandstock-mobile, buyer-portal-app]
    owns_data: []
    purpose: "React Native mobile/tablet app. Offline-capable via local SQLite. SSO-federates with the legacy ASP.NET Buyer Portal."

  - name: ong-devops
    repo: /Users/rsengupta/projects/ong/ong-devops
    aliases: [devops]
    owns_data: []
    purpose: "Local docker-compose orchestration plus Jenkins/deploy configs. Not application code."

# Journeys worth tracing end to end, roughly in the order they will teach you
# the most. `cartographer` will suggest more once the graph exists.
flows:
  - buyer submits a purchase order
  - order cancellation
  - EDI order intake through transform
  - email/PDF addendum ingestion by the agent module
  - catalog price lookup during order entry
  - notification fan-out after an order event

# Exported APM service graphs. THE highest-value thing you can add: measured
# traffic beats every inference in this file, and it reveals services whose
# repos you do not have. Ask which APM the team runs, export its service
# dependency graph, and list the file here.
#
# Accepts: OpenTelemetry servicegraph metrics (Prometheus text), Jaeger or
# Zipkin /api/dependencies JSON, or a source,target,calls CSV.
traces: []
  # - ~/exports/oms-servicegraph.prom

# ---------------------------------------------------------------------------
# Notes carried over from the reference that cartographer cannot infer:
#
#   * No JPA/Hibernate/MyBatis anywhere. Schema comes from SQL, not from
#     annotations -- which is exactly why the `schema` command exists.
#   * Two migration systems coexist: legacy database/<module>/patches/*.sql and
#     Flyway db/migration/{all,dev,uat,sqe,prd}/V*.sql. cartographer reads both
#     and records which system declared each table.
#   * Kafka topic names are runtime-computed from KafkaConstants enum values,
#     NOT the literal names in docker-compose. cartographer resolves the
#     constants; the compose topic list is stale and should be ignored.
#   * Redis is used through @RedisCacheable AOP in most modules, so direct
#     RedisTemplate calls are rare and grepping for them finds little.
#   * Schema for nexus, integration, inventory, contract and transform is NOT
#     in ong-server-repo -- reference §2.5 points at an external
#     database-scripts-repo. Clone it and add it under `roots:` to complete the
#     schema map.
# ---------------------------------------------------------------------------
